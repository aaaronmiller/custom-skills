<!--
Living document contract:
This browser shell renders a living document: an addressable review surface for asynchronous human-agent collaboration. Chat and terminal scrollback are poor surfaces for sustained review because agents generate faster than humans can read, annotate, and decide. The canonical reason-for-being lives in ../RAISON_DETRE.md and references/raison-detre.md in the skill package.
-->
<!doctype html>
<html lang="en" data-theme="obsidian" data-motion="system">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0b1114" />
    <meta name="description" content="A browser-native living document for asynchronous human-agent review." />
    <link rel="manifest" href="manifest.webmanifest" />
    <title>Agent-Human Living Document</title>
    <script>
      (() => {
        const allowed = ['system', 'obsidian', 'graphite', 'paper', 'high-contrast'];
        const saved = localStorage.getItem('ldf:theme');
        const theme = allowed.includes(saved) ? saved : 'obsidian';
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.motion = localStorage.getItem('ldf:motion') || 'system';
      })();
    </script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to document</a>
    <div id="app" aria-live="polite">
      <div class="boot-screen">
        <div class="boot-mark" aria-hidden="true">LDF</div>
        <p>Opening the document workbench…</p>
      </div>
    </div>
    <noscript>This living document requires JavaScript for navigation and local editing. The canonical Markdown remains readable in <code>public/content/sections/</code>.</noscript>
    <script type="module" src="app.js"></script>
  </body>
</html>
